apply plugin: 'java'
apply plugin: 'war'
group = 'de.thb.fbi.msr.maus.einkaufsliste'
version = '1.0-SNAPSHOT'
sourceCompatibility = 1.8
targetCompatibility = 1.8


dependencies {
    providedCompile group: 'javax', name: 'javaee-api', version:'7.0'


    // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.8.5'

    // https://mvnrepository.com/artifact/org.scannotation/scannotation
    implementation group: 'org.scannotation', name: 'scannotation', version: '1.0.3'


    // https://mvnrepository.com/artifact/log4j/log4j
    implementation group: 'log4j', name: 'log4j', version: '1.2.16'

}

tasks.register("prepareKotlinBuildScriptModel") {}